<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="theme-color" content="#071428" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Super Infra" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <style>
      .superinfra-boot-loader { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #eef3fb; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; color: #0f172a; }
      .superinfra-boot-loader__card { width: min(360px, 92vw); display: grid; justify-items: center; gap: 16px; padding: 28px; border-radius: 24px; background: rgba(255,255,255,.94); box-shadow: 0 18px 56px rgba(15,23,42,.12); }
      .superinfra-boot-loader__card img { display: block; width: min(245px, 72vw); height: auto; }
      .superinfra-boot-loader__track { width: 100%; height: 7px; overflow: hidden; border-radius: 999px; background: #dbe4f0; }
      .superinfra-boot-loader__track span { display: block; width: 42%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #1455ff, #0ea5e9); animation: superinfraBootLoading 1.1s ease-in-out infinite; }
      .superinfra-boot-loader__card strong { font-size: .98rem; }
      .superinfra-boot-loader__card small { color: #64748b; }
      @keyframes superinfraBootLoading { 0% { transform: translateX(-115%); } 100% { transform: translateX(340%); } }
      @media (prefers-reduced-motion: reduce) { .superinfra-boot-loader__track span { animation-duration: 2.4s; } }
    </style>
    <title>Super Infra</title>
  </head>
  <body>
    <noscript>Ative o JavaScript para usar o sistema da Super Infra.</noscript>
    <div id="root">
      <div class="superinfra-boot-loader" role="status" aria-label="Carregando sistema">
        <div class="superinfra-boot-loader__card">
          <img src="%PUBLIC_URL%/imagem/superinfra.png" alt="Super Infra" width="307" height="93" />
          <div class="superinfra-boot-loader__track" aria-hidden="true"><span></span></div>
          <strong>Carregando sistema...</strong>
          <small>Aguarde alguns instantes.</small>
        </div>
      </div>
    </div>
  </body>
</html>
